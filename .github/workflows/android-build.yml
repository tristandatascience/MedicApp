name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tests unitaires + APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Droits d'exécution du wrapper
        run: chmod +x gradlew

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilation APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests-unitaires
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release GitHub (sur tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer l'APK compilé
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk/

      - name: Créer la release avec l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            apk/app-debug.apk \
            --title "Dossier Médical ${GITHUB_REF_NAME}" \
            --notes "Application Android de gestion du dossier médical personnel (V1 stockage local chiffré).

          **Contenu de l'APK** : 5 modules (vaccinations, traitements, ordonnances, examens, rendez-vous), numérisation multi-pages avec OCR hors ligne, verrouillage PIN/biométrie, chiffrement AES-256 (SQLCipher + Keystore), rappels locaux, recherche globale, sauvegarde chiffrée par mot de passe.

          **Installation** : télécharger l'APK puis l'ouvrir sur le téléphone (autoriser « sources inconnues »). Android 8.0 minimum.

          ⚠️ APK signé en debug (signature de test) : convient aux essais personnels ; pour une publication Play Store, une release signée sera nécessaire." \
            --latest
